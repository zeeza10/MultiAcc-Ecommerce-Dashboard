name: Verify application

on:
  push:
    branches: [main, phase-3-worker-api-foundation, feature/employee-access-control, feature/user-specific-permission-overrides]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Migration version consistency
        run: npm run check:migrations
      - name: TypeScript check
        run: npm run lint
      - name: Worker boundary tests
        run: npm test
      - name: Smoke test the local Cloudflare Worker through Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 8787 > /tmp/multiacc-vite-worker.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/v1/health > /tmp/multiacc-health.json; then
              cat /tmp/multiacc-health.json
              grep -q '"success":true' /tmp/multiacc-health.json
              grep -q 'Cloudflare Workers' /tmp/multiacc-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/multiacc-vite-worker.log
          exit 1
      - name: Production build
        run: npm run build
      - name: Cloudflare Worker dry run
        run: npm run cf:dry-run

