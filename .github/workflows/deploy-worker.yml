name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows: ["Verify application"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: multiacc-production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact verified main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        run: npm run build

      - name: Check Cloudflare deployment credential
        id: cloudflare-token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production deployment skipped. Add the CLOUDFLARE_API_TOKEN repository secret to enable deployment."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Cloudflare Worker
        if: steps.cloudflare-token.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e47d43ccdf4b53a34a31e76525862665
        run: npx wrangler deploy

      - name: Verify production health and security headers
        if: steps.cloudflare-token.outputs.available == 'true'
        env:
          WORKER_URL: https://multiacc-ecommerce-dashboard.zeeshan-m-personal.workers.dev
        run: |
          curl --silent --show-error --fail-with-body -D headers.txt "$WORKER_URL/api/v1/health" -o body.json
          grep -qi '^HTTP/.* 200' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          grep -qi '^strict-transport-security: max-age=31536000' headers.txt
          cat body.json
