name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows:
      - Verify application
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: multiacc-production-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact verified main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        run: npm run build

      - name: Require Cloudflare deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Production deployment cannot proceed. Add the CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e47d43ccdf4b53a34a31e76525862665
        run: npx wrangler deploy

      - name: Verify production health and security headers
        if: steps.cloudflare-token.outputs.available == 'true'
        env:
          WORKER_URL: https://app.oriafuture.com
        run: |
          curl --silent --show-error --fail-with-body -D headers.txt "$WORKER_URL/api/v1/health" -o body.json
          grep -qi '^HTTP/.* 200' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          grep -qi '^strict-transport-security: max-age=31536000' headers.txt
          cat body.json
