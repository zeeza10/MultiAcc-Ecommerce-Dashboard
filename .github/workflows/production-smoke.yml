name: Production Worker Security Smoke Test

on:
  workflow_run:
    workflows:
      - Deploy Cloudflare Worker
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health and security headers
        env:
          WORKER_URL: https://app.oriafuture.com
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body -D health.headers "$WORKER_URL/api/v1/health" -o health.json
          grep -qi '^HTTP/.* 200' health.headers
          grep -qi '^x-content-type-options: nosniff' health.headers
          grep -qi '^x-frame-options: DENY' health.headers
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' health.headers
          grep -qi '^strict-transport-security: max-age=31536000' health.headers
          cat health.json

      - name: Verify fingerprinted frontend assets use immutable caching
        env:
          WORKER_URL: https://app.oriafuture.com
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body "$WORKER_URL/" -o index.html
          js_asset=$(grep -oE 'src="/assets/[^" ]+\.js"' index.html | head -n 1 | cut -d '"' -f 2)
          test -n "$js_asset"
          curl --silent --show-error --fail-with-body -D asset.headers -o app.bundle.js "$WORKER_URL$js_asset"
          grep -Eqi '^cache-control: public, max-age=31536000, immutable' asset.headers
          if grep -Eq 'console\\.log[[:space:]]*\\(' app.bundle.js; then
            echo "Production bundle contains console.log debug calls."
            exit 1
          fi
          if grep -Fq 'nexusops_active_organization_id' app.bundle.js; then
            echo "Production bundle contains the legacy organization storage key."
            exit 1
          fi
          echo "Production entry bundle bytes: $(wc -c < app.bundle.js)"


      - name: Verify private robots policy
        env:
          WORKER_URL: https://app.oriafuture.com
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error -D robots.headers -o robots.txt -w '%{http_code}' "$WORKER_URL/robots.txt")
          test "$status" = "200"
          grep -qi '^content-type: text/plain' robots.headers
          grep -Fxq 'User-agent: *' robots.txt
          grep -Fxq 'Disallow: /' robots.txt

      - name: Verify unknown routes return a real 404
        env:
          WORKER_URL: https://app.oriafuture.com
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error -o not-found.html -w '%{http_code}' "$WORKER_URL/this-page-does-not-exist-123")
          test "$status" = "404"
          grep -q '404' not-found.html
          grep -q 'Return to Oria Future dashboard' not-found.html

      - name: Verify unauthenticated API requests are rejected
        env:
          WORKER_URL: https://app.oriafuture.com
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error -D unauth.headers -o unauth.json -w '%{http_code}' "$WORKER_URL/api/v1/products")
          test "$status" = "401"
          grep -qi '^x-content-type-options: nosniff' unauth.headers

      - name: Verify oversized API bodies are rejected
        env:
          WORKER_URL: https://app.oriafuture.com
        run: |
          set -euo pipefail
          head -c 1048577 /dev/zero > oversized.bin
          status=$(curl --silent --show-error -D oversized.headers -o oversized.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' --data-binary @oversized.bin \
            "$WORKER_URL/api/v1/products")
          test "$status" = "413"

      - name: Verify hostile CORS origins are rejected
        env:
          WORKER_URL: https://app.oriafuture.com
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error -D cors.headers -o cors.txt -w '%{http_code}' \
            -X OPTIONS -H 'Origin: https://attacker.example' \
            -H 'Access-Control-Request-Method: POST' "$WORKER_URL/api/v1/products")
          test "$status" = "403"
          if grep -qi '^access-control-allow-origin: https://attacker.example' cors.headers; then
            echo "Hostile origin was reflected by CORS."
            exit 1
          fi
